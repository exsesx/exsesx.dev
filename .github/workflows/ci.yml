name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Dependency dedupe check
        run: bun dedupe --check
      - name: Biome check
        run: bun run biome:check
      - name: MDX check
        run: bun run mdx:check
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('package.json', 'src/**', 'public/**', 'next.config.mts', 'postcss.config.js', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('bun.lock') }}-
      - name: Build
        run: bun run build
      - name: Install browser
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Chromium browser tests
        run: bun run test:e2e --project=desktop-chromium --project=mobile-chromium

  # Linux WebKit's WPE backend stalls animation frames with backdrop filters.
  # Run Safari contracts against Apple WebKit without changing their assertions.
  verify-webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Install browser
        run: bunx playwright install webkit
      - name: WebKit browser tests
        run: bun run test:e2e --project=mobile-webkit-iphone-17-pro
      - name: Upload WebKit failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-failure-traces
          path: ${{ runner.temp }}/exsesx-dev-playwright-results
          retention-days: 7
